spring:
  application:
    name: transport-service

  #postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/transport_db
    username: transport_user
    password: ${TRANSPORT_DB_PASSWORD}
    #jpa / hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

server:
  port: 8081